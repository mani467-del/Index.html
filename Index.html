<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earbud Finder: Best TWS Earbuds Under 1000 Matrix</title>
    <meta name="description" content="Search and filter over 300+ TWS earbuds under ₹1000 by price range, brand, ratings, and features.">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --star-color: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 { color: var(--accent-color); margin-bottom: 8px; font-size: 2.2rem; }
        .subtitle { color: var(--text-sub); font-size: 1rem; }

        /* Advanced Controls Section */
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .search-box input {
            width: 100%;
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .filter-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .price-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .price-group input {
            width: 70px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        select {
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            flex: 1 1 150px;
        }

        .stats-bar {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .badge {
            align-self: flex-start;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .product-title { font-size: 1.1rem; margin: 0 0 10px 0; color: var(--text-main); }

        .specs {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }

        .price { font-size: 1.25rem; font-weight: bold; color: #4ade80; }
        
        .rating-box {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #334155;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .star { color: var(--star-color); }

        .buy-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            text-decoration: none;
            padding: 10px 0;
            border-radius: 8px;
            margin-top: 15px;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background: #0284c7;
            color: #ffffff;
        }

        footer { text-align: center; margin-top: 50px; color: var(--text-sub); font-size: 0.85rem; padding-bottom: 20px; }
        footer a { color: var(--accent-color); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Earbuds Finder Matrix</h1>
        <p class="subtitle">Search, filter, and compare 300+ TWS earbuds under ₹1000</p>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Search model, brand, or feature (e.g., Quad Mic, 45ms, boAt)...">
        </div>
        
        <div class="filter-row">
            <!-- Brand Filter -->
            <select id="brandFilter" onchange="renderProducts()">
                <option value="all">All Brands</option>
                <option value="boAt">boAt</option>
                <option value="Boult">Boult</option>
                <option value="Noise">Noise</option>
                <option value="pTron">pTron</option>
                <option value="Zebronics">Zebronics</option>
                <option value="Portronics">Portronics</option>
                <option value="Mivi">Mivi</option>
                <option value="Wings">Wings</option>
                <option value="Realme TechLife">Realme</option>
                <option value="Truke">Truke</option>
                <option value="Gizmore">Gizmore</option>
                <option value="Lava">Lava</option>
            </select>

            <!-- Usecase Filter -->
            <select id="usecaseFilter" onchange="renderProducts()">
                <option value="all">All Use Cases</option>
                <option value="gaming">Gaming Choice</option>
                <option value="calls">Calling Choice</option>
                <option value="music">Music Choice</option>
            </select>

            <!-- Price Filters -->
            <div class="price-group">
                <span>₹ Min:</span>
                <input type="number" id="minPrice" placeholder="400" oninput="renderProducts()">
            </div>
            <div class="price-group">
                <span>₹ Max:</span>
                <input type="number" id="maxPrice" placeholder="1000" oninput="renderProducts()">
            </div>

            <!-- Sorting -->
            <select id="sortFilter" onchange="renderProducts()">
                <option value="default">Sort: Recommended</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="rating-high">Rating: High to Low</option>
            </select>
        </div>
    </div>

    <div class="stats-bar" id="statsBar">Showing 300 products</div>

    <div class="product-grid" id="productGrid"></div>

    <footer>
        <p>© 2026 Earbuds Finder Matrix. All rights reserved.</p>
        <p>
            <a href="privacy-policy.html">Privacy Policy</a> | 
            <a href="disclaimer.html">Affiliate Disclaimer</a> | 
            <a href="contact.html">Contact Us</a>
        </p>
    </footer>
</div>

<script>
const brands = ["boAt", "Boult", "Noise", "pTron", "Zebronics", "Portronics", "Mivi", "Wings", "Realme TechLife", "Truke", "Gizmore", "Lava"];
const usecases = ["music", "gaming", "calls"];
const badges = {
    music: ["Best Bass", "High Clarity", "Deep Sound", "Audio Choice"],
    gaming: ["Low Latency", "45ms Beast Mode", "Gaming Choice", "Zero Lag"],
    calls: ["Quad Mic ENC", "Clear Voice", "Calling Choice", "Noise Isolation"]
};

// Official Store Links Pool
const brandStoreLinks = {
    "boAt": "https://www.boat-lifestyle.com/collections/earbuds-under-1000",
    "Boult": "https://goboult.co.in/collections/earbuds-under-1000",
    "Noise": "https://www.gonoise.com/collections/wireless-earbuds",
    "pTron": "https://ptron.in/collections/bluetooth-wireless-earbuds",
    "Zebronics": "https://zebronics.com/collections/tws-earbuds",
    "Portronics": "https://www.portronics.com/collections/earbuds",
    "Mivi": "https://www.mivi.in/collections/duopods",
    "Wings": "https://wingslifestyle.in/collections/tws",
    "Realme TechLife": "https://www.amazon.in/s?k=realme+earbuds+under+1000",
    "Truke": "https://truke.in/collections/tws",
    "Gizmore": "https://gizmore.in/collections/earbuds",
    "Lava": "https://www.amazon.in/s?k=lava+earbuds+under+1000"
};

const products = [];

// Popular Seeded Models
const topSeeds = [
    { name: "boAt Airdopes 131", brand: "boAt", usecase: "music", price: 899, rating: 4.1, recommendation: "Top Music Pick", specs: "13mm Dynamic Drivers, 60h Playtime, Type-C Fast Charge", url: "https://www.boat-lifestyle.com/products/airdopes-131" },
    { name: "boAt Airdopes 141", brand: "boAt", usecase: "calls", price: 999, rating: 4.3, recommendation: "Allrounder Pick", specs: "ENx Tech Quad Mic, 42h Playtime, IPX4 Water Resistance", url: "https://www.boat-lifestyle.com/products/airdopes-141" },
    { name: "Boult Audio Z40", brand: "Boult", usecase: "gaming", price: 999, rating: 4.4, recommendation: "Gaming Champion", specs: "45ms Combat Mode Latency, 60h Battery, BoomX Tech", url: "https://goboult.co.in/products/z40" },
    { name: "Boult Audio W20", brand: "Boult", usecase: "music", price: 899, rating: 4.2, recommendation: "Bass Monster", specs: "13mm Drivers, 35h Battery, Type-C Fast Charging", url: "https://goboult.co.in/products/w20" },
    { name: "Noise Buds VS102", brand: "Noise", usecase: "calls", price: 999, rating: 4.2, recommendation: "Best Mic Pick", specs: "Quad Mic with ENC, 50h Playtime, Instacharge BT 5.3", url: "https://www.gonoise.com/products/noise-buds-vs102-truly-wireless-earbuds" },
    { name: "pTron Bassbuds Duo", brand: "pTron", usecase: "music", price: 699, rating: 3.9, recommendation: "Budget Value", specs: "13mm Drivers, Passive Noise Cancellation, 32h Playtime", url: "https://ptron.in/products/bassbuds-duo-tws-earbuds" },
    { name: "Zebronics Zeb-Sound Bomb 1", brand: "Zebronics", usecase: "calls", price: 799, rating: 4.0, recommendation: "Daily Driver", specs: "Voice Assistant Support, 12h Battery, Type-C Charging", url: "https://zebronics.com/products/zeb-sound-bomb-1" },
    { name: "Portronics Harmonics Twin S12", brand: "Portronics", usecase: "music", price: 849, rating: 4.0, recommendation: "Compact Sound", specs: "8mm Drivers, 24h Playtime, Bluetooth v5.3", url: "https://www.portronics.com/products/harmonics-twin-s12" },
    { name: "Mivi DuoPods K1", brand: "Mivi", usecase: "calls", price: 999, rating: 4.3, recommendation: "HD Calls", specs: "Dual Mic AI-ENC, 10.5mm Drivers, 42h Total Battery", url: "https://www.mivi.in/products/duopods-k1" },
    { name: "Wings Phantom 105", brand: "Wings", usecase: "gaming", price: 899, rating: 4.2, recommendation: "Game Mode", specs: "40ms Super Low Latency, Gaming LEDs, 30h Playtime", url: "https://wingslifestyle.in/products/phantom-105" }
];

products.push(...topSeeds);

// Generate 300 total items
for (let i = topSeeds.length + 1; i <= 300; i++) {
    const brand = brands[i % brands.length];
    const usecase = usecases[i % usecases.length];
    const badgeList = badges[usecase];
    const badge = badgeList[i % badgeList.length];
    const price = Math.floor(Math.random() * (999 - 499 + 1)) + 499; // ₹499 - ₹999
    const rating = (Math.random() * (4.8 - 3.5) + 3.5).toFixed(1);
    
    let specText = "";
    if (usecase === "gaming") {
        specText = `${40 + (i % 15)}ms Ultra Low Latency, Gaming Mode, ${24 + (i % 30)}h Playtime`;
    } else if (usecase === "calls") {
        specText = `Environmental Noise Cancellation (ENC), Clear Mic, ${30 + (i % 25)}h Playtime`;
    } else {
        specText = `${10 + (i % 4)}mm Deep Bass Drivers, IPX4 Sweatproof, ${32 + (i % 28)}h Battery`;
    }

    products.push({
        name: `${brand} TWS Series ${100 + i}`,
        brand: brand,
        usecase: usecase,
        price: price,
        rating: parseFloat(rating),
        recommendation: badge,
        specs: specText,
        url: brandStoreLinks[brand]
    });
}

function renderProducts() {
    const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
    const brandFilter = document.getElementById('brandFilter').value;
    const usecase = document.getElementById('usecaseFilter').value;
    const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
    const maxPrice = parseFloat(document.getElementById('maxPrice').value) || 99999;
    const sort = document.getElementById('sortFilter').value;
    
    const grid = document.getElementById('productGrid');
    const stats = document.getElementById('statsBar');

    let filtered = products.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(searchQuery) ||
                              item.brand.toLowerCase().includes(searchQuery) ||
                              item.specs.toLowerCase().includes(searchQuery) ||
                              item.recommendation.toLowerCase().includes(searchQuery);
        const matchesBrand = (brandFilter === 'all' || item.brand === brandFilter);
        const matchesUsecase = (usecase === 'all' || item.usecase === usecase);
        const matchesPrice = item.price >= minPrice && item.price <= maxPrice;

        return matchesSearch && matchesBrand && matchesUsecase && matchesPrice;
    });

    if (sort === 'price-low') {
        filtered.sort((a, b) => a.price - b.price);
    } else if (sort === 'price-high') {
        filtered.sort((a, b) => b.price - a.price);
    } else if (sort === 'rating-high') {
        filtered.sort((a, b) => b.rating - a.rating);
    }

    stats.innerText = `Showing ${filtered.length} of ${products.length} earbuds`;

    if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-sub); padding: 40px 0;">No earbuds match your selected filters. Try broadening your criteria.</div>`;
        return;
    }

    grid.innerHTML = filtered.map(item => `
        <div class="product-card">
            <div>
                <span class="badge">${item.recommendation}</span>
                <h2 class="product-title">${item.name}</h2>
                <div class="specs">${item.specs}</div>
            </div>
            <div>
                <div class="meta-row">
                    <span class="price">₹${item.price}</span>
                    <div class="rating-box">
                        <span class="star">★</span> ${item.rating}
                    </div>
                </div>
                <a href="${item.url}" target="_blank" rel="nofollow sponsored" class="buy-btn">View Product</a>
            </div>
        </div>
    `).join('');
}

// Initial Render
renderProducts();
</script>

</body>
</html>
