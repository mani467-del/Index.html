<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TWS Earbuds Finder Matrix</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        h1 { color: var(--accent-color); margin-top: 0; }
        p { color: var(--text-sub); font-size: 0.95rem; }
        a { color: var(--accent-color); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .contact-box {
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-top: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Back to Home</a>
    
    <h1>Contact Us</h1>
    <p>Have questions, feedback, business inquiries, or site suggestions? We'd love to hear from you.</p>

    <div class="contact-box">
        <h2 style="margin-top:0; color: var(--text-main); font-size: 1.2rem;">Direct Communication</h2>
        <p>You can reach our administrative team directly via email:</p>
        <p style="font-size: 1.1rem;"><strong>Email:</strong> <a href="mailto:manibontha467@gmail.com">manibontha467@gmail.com</a></p>
        <p style="font-size: 0.85rem; color: #64748b;">We aim to respond to all inquiries within 24–48 hours.</p>
    </div>
</div>

</body>
</html>
